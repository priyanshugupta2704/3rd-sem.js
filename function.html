<!DOCTYPE html>
<html>
<head>
    <title>Multiplication using Function</title>
</head>
<body>

    <h2>JavaScript Function Result</h2>
    <button onclick="multiply()">Multiply Numbers</button>

    <script>
        function result(a, b) {  
            return a * b;
        }

        function multiply() {
            let num1 = prompt("Enter first number:");
            let num2 = prompt("Enter second number:");

            num1 = Number(num1);
            num2 = Number(num2);

            let ans = result(num1, num2);

            alert("Multiplication = " + ans);
            console.log("Multiplication = " + ans);
        }
    </script>

</body>
</html>
