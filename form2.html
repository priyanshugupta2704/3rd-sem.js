<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Keyboard Events</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top left, #243b55, transparent 40%),
                radial-gradient(circle at bottom right, #6a11cb, transparent 40%),
                #0f172a;

            color: white;
        }

        .container {
            width: 420px;
            padding: 35px;

            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 25px;

            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.4),
                inset 0 1px rgba(255, 255, 255, 0.1);

            animation: appear 0.8s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title {
            text-align: center;
            margin-bottom: 8px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #b8c1d1;
            margin-bottom: 30px;
        }

        .event-box {
            margin-bottom: 20px;
        }

        .event-box label {
            display: block;
            margin-bottom: 8px;
            color: #dbeafe;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px 16px;

            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;

            outline: none;

            background: rgba(255, 255, 255, 0.08);
            color: white;

            font-size: 16px;

            transition: 0.3s;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.4);
            transform: scale(1.02);
        }

        .status {
            margin-top: 25px;
            padding: 15px;

            text-align: center;

            border-radius: 12px;

            background: rgba(96, 165, 250, 0.12);
            border: 1px solid rgba(96, 165, 250, 0.25);

            color: #93c5fd;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1 class="title">⌨️ Keyboard Events</h1>

        <p class="subtitle">
            Explore JavaScript keyboard events
        </p>

        <div class="event-box">
            <label>ON KEYDOWN</label>

            <input
                type="text" ON KEYDOWN"alert"(this.value)>
        </div>

        <div class="event-box">
            <label>ON KEYUP</label>

            <input
                type="text"ON KEYUP="alert(this.value)">
                
        </div>

        <div class="event-box">
            <label>ON KEYPRESS</label>

            <input
                type="text"ON KEYPRESS="alert(this.value)"
        </div>

        <div class="status" id="result">
            Waiting for keyboard activity...
        </div>

        <div class="footer">
            JavaScript Event Demonstration
        </div>

    </div>
    <div id="form">
        <h1 id="h1"> Keyboard Event</h1>
        <p>ONKEYDOWN</p>
        <input type="text" ONKEYDOWN=""dolement>
    </div>


    <script>

        function keyDown() {
            document.getElementById("result").innerHTML =
                "⚡ Key Down Event Detected";
        }

        function keyUp() {
            document.getElementById("result").innerHTML =
                "🔓 Key Up Event Detected";
        }

        function keyPress() {
            document.getElementById("result").innerHTML =
                "⌨️ Key Press Event Detected";
        }

    </script>

</body>
</html>
